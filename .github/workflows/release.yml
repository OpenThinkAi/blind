name: release

# Publishes @openthink/blind to npm. One trigger: workflow_dispatch, run by hand from the Actions tab on main.
# There is no tag trigger: .stamp/mirror.yml mirrors main only, so tags never reach GitHub and main is the only
# release ref. A dispatch publishes only when run on main: the publish job's `if:` skips it on any other branch,
# so a build that never passed the stamp gate on main cannot reach npm with a provenance attestation.
# It deliberately does NOT run on every push to main: merging this file must
# not publish, and the first publish waits on the npm Trusted Publisher being configured for this repo and
# this workflow filename (npm package -> Settings -> Trusted Publishers).
#
# Auth is OIDC Trusted Publishing, no NPM_TOKEN; --provenance attaches an SLSA attestation. The publish is
# skipped when package.json's version is already on npm, so re-runs are safe.
#
# The `if:` below is only this file's own rule: a release.yml edited on another branch could drop it. What the
# registry enforces is the `npm-release` environment: GitHub lets only main deploy to it, and npm's Trusted
# Publisher names it, so a token minted outside it is refused (RELEASING.md, one-time setup). The publish job
# also checks that the commit it publishes is on main.
#
# Node is pinned to an exact release so the npm that runs the publish is reviewed, not whatever 24.x is newest.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned by full commit SHA: the publish job below holds id-token: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
      # Bun is the runtime and test runner; installed from npm at a pinned version rather than a third-party action.
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Tests may commit to temp git repos; a CI runner has no global git identity, unlike a developer machine.
      - run: git config --global user.name "blind CI" && git config --global user.email "ci@blind.invalid"
      - run: bun test --timeout 30000

  publish:
    needs: check
    # workflow_dispatch can be run on any branch; only main is stamp-reviewed, so only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and branches, for the on-main check below.
          fetch-depth: 0

      # Only stamp-merged commits publish: the commit must be on main.
      - name: commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main; only commits merged through stamp are published" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      # package.json values are file content: pass them through env, never ${{ }} into the script.
      - name: read target version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          {
            echo "name<<__EOF_NAME_$$"
            echo "$NAME"
            echo "__EOF_NAME_$$"
            echo "version<<__EOF_VERSION_$$"
            echo "$VERSION"
            echo "__EOF_VERSION_$$"
            echo "dist_tag<<__EOF_DIST_TAG_$$"
            echo "$DIST_TAG"
            echo "__EOF_DIST_TAG_$$"
          } >> "$GITHUB_OUTPUT"
          echo "target: $NAME@$VERSION (dist-tag: $DIST_TAG)"

      - name: check npm registry
        id: check
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already on npm, skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION not on npm, will publish."
          fi

      # npm 11.5.1+ is needed for OIDC auth on the registry PUT. The pinned Node bundles npm 11, so publish with that
      # bundled npm (no runtime fetch: this job holds id-token). Fail rather than publish with an older npm.
      - name: npm supports trusted publishing
        run: |
          V=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$V" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $V is older than 11.5.1 (needed for OIDC trusted publishing)" >&2
            exit 1
          fi
          echo "npm $V"

      # No build step: the package ships source (src/ runs on Bun).
      - name: publish
        if: steps.check.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
